    function arrive(sample) {
      const card = {
        id: ++cardSeq,
        freq: sample.freq,
        units: sample.units,
        fresh: true,
        seenAt: new Date(),
        body:
          "ꑭ ПОТІК 125 ОВМБр\nДжерело: " + (sample.source || "⚛️ Нейтрон 2.0 ⚛️") + "\nІєрархія: " +
          sample.units.join(" > ") +
          "\n\n" +
          sample.freq +
          " · " +
          new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }) +
          "\nукх р/м · " +
          sample.place +
          (sample.name ? "\n" + sample.name : "") +
          "\n\n– Макет. Нова картка.",
      };
      for (const existing of cards) existing.fresh = false;
      cards.unshift(card);
      const active = currentFlow();
      if (matchesSet(active.filters, card)) active.seen.add(card.id);
      paintSignals();
      renderFeed();
    }

    function paintSignals() {
      for (const flow of flows) {
        const tab = document.querySelector('.tab[data-flow="' + flow.id + '"]');
        if (!tab) continue;
        const unread = unreadCount(flow);
        const total = positive(flow.filters) ? hitCount(flow) : 0;
        let dot = tab.querySelector(".tab-new");
        let extra = tab.querySelector(".tab-unread");
        const count = tab.querySelector(".tab-count");
        if (!count) continue;
        count.textContent = positive(flow.filters) ? String(total) : "—";
        count.classList.remove("is-new");
        if (unread && !dot) {
          dot = document.createElement("span");
          dot.className = "tab-new";
          tab.insertBefore(dot, tab.firstChild);
        }
        if (!unread && dot) dot.remove();
        if (unread && !extra) {
          extra = document.createElement("span");
          extra.className = "tab-unread";
          count.after(extra);
        }
        if (unread && extra) extra.textContent = "+" + unread;
        if (!unread && extra) extra.remove();
      }
    }

    function cardClock(card) {
      const match = String(card.body || "").match(/28\.09\s+(\d{2}:\d{2})/);
      return match ? match[1] : "00:00";
    }

    let queuedCards = null;

    function startTicker() {
      if (ticker) return;
      if (!queuedCards) {
        queuedCards = cards.slice().sort((a, b) => cardClock(a).localeCompare(cardClock(b)) || a.id - b.id);
        cards.length = 0;
      }
      const step = () => {
        if (!queuedCards.length) {
          stopTicker();
          return;
        }
        const card = queuedCards.shift();
        for (const existing of cards) existing.fresh = false;
        card.fresh = true;
        const watchingTop = new Map(flows.map((flow) => [flow.id, atTop(boardScroller(flow))]));
        cards.unshift(card);
        renderFeed();
        for (const flow of flows) {
          if (watchingTop.get(flow.id) && matchesSet(flow.filters, card)) flow.seen.add(card.id);
        }
        paintSignals();
      };
      step();
      ticker = setInterval(step, 2000);
    }

    function stopTicker() {
      clearInterval(ticker);
      ticker = null;
    }

    function render() {
      const flow = currentFlow();
      if (atTop(boardScroller(flow))) markSeen(flow);
      document.getElementById("filter-eyebrow").textContent = "Фільтр · " + flow.name;
      renderTabs();
      renderFilters();
      renderFeed();
      if (atTop(boardScroller(flow))) {
        markSeen(flow);
        paintSignals();
      }
      syncWatch();
    }

    function syncWatch() {
      const tab = document.getElementById("watch-tab");
      const desk = document.querySelector(".workspace");
      const watch = document.getElementById("watch");
      if (!tab || !desk || !watch) return;
      tab.classList.toggle("on", watchOpen);
      desk.classList.toggle("is-watch", watchOpen);
      if (watchOpen) {
        document.body.appendChild(watch);
        watch.classList.add("is-open");
        watch.style.display = "grid";
        watch.style.position = "fixed";
        watch.style.top = "138px";
        watch.style.left = "0";
        watch.style.right = "0";
        watch.style.bottom = "0";
        watch.style.width = "100vw";
        watch.style.maxWidth = "none";
        watch.style.height = "auto";
        watch.style.zIndex = "40";
        watch.style.gridTemplateColumns = watchThreadsCollapsed ? "48px minmax(0, 1fr)" : "240px minmax(0, 1fr)";
        watch.style.background = "#000";
      } else {
        watch.classList.remove("is-open");
        watch.style.display = "none";
      }
    }

    function archiveCards() {
      return cards.concat(queuedCards || []);
    }

    let watchRun = 0;

    function setWatchStep(name) {
      const list = document.getElementById("watch-steps");
      if (!list) return;
      for (const item of list.querySelectorAll("li")) {
        item.classList.toggle("is-on", item.dataset.step === name);
      }
    }

    const WATCH_STOP = new Set("або але біля було була були для його коли куди між після про під сьогодні також тільки через хто що якщо ввечері відомо робив робила виходив виходила відправив доповіла доповів наказав".split(" "));

    function watchStems(word) {
      if (WATCH_STOP.has(word) || word.length < 3) return [];
      if (/^\d/.test(word)) return [word];
      const stems = [];
      const add = (stem) => {
        if (stem.length >= 4 || (stem.length >= 3 && word.length <= 4)) stems.push(stem);
      };
      add(word);
      for (const suffix of ["івкою", "івки", "івка", "ою", "ому", "ами", "кою", "ки", "ка", "ку", "ом", "ем", "а", "у", "і", "и", "е"]) {
        if (word.endsWith(suffix) && word.length - suffix.length >= 3) add(word.slice(0, -suffix.length));
      }
      return stems;
    }

    function watchHits(question) {
      const stems = fold(question).split(/[^\p{L}\p{N}.]+/u).flatMap(watchStems);
      if (!stems.length) return [];
      return archiveCards().filter((card) => {
        const text = fold(card.body);
        return stems.some((stem) => text.includes(stem));
      }).slice(0, 8);
    }

    function watchCardLine(card) {
      const lines = String(card.body || "").split("\n");
      const source = (lines.find((line) => line.startsWith("Джерело:")) || "").replace(/^Джерело:\s*/, "");
      const chain = (lines.find((line) => line.startsWith("Ієрархія:")) || "").replace(/^Ієрархія:\s*/, "");
      const quote = lines.find((line) => /^[–—=]/.test(line.trim())) || "";
      return { freq: card.freq, source: displaySource(source), chain, quote };
    }

    function currentThread() {
      return watchThreads.find((thread) => thread.id === watchThreadId) || null;
    }

    function ensureThread() {
      const open = watchThreads.find((thread) => thread.id === watchThreadId && !thread.archived);
      if (open) return open;
      const thread = { id: "t" + Date.now(), title: "Новий тред", archived: false, messages: [] };
      watchThreads.unshift(thread);
      watchThreadId = thread.id;
      return thread;
    }

    function archiveThread(id) {
      const thread = watchThreads.find((item) => item.id === id);
      if (!thread) return;
      thread.archived = true;
      if (watchThreadId === id) {
        const next = watchThreads.find((item) => !item.archived);
        watchThreadId = next ? next.id : "";
      }
      watchArchiveOpen = true;
      paintWatch();
    }

    function deleteThread(id) {
      if (watchRunThread === id) watchRun = 0;
      watchThreads = watchThreads.filter((item) => item.id !== id);
      if (watchThreadId === id) {
        const next = watchThreads.find((item) => !item.archived);
        watchThreadId = next ? next.id : "";
      }
      paintWatch();
    }

    function threadRow(thread) {
      const row = document.createElement("div");
      row.className = "watch-thread" + (thread.id === watchThreadId ? " on" : "");
      const open = document.createElement("button");
      open.type = "button";
      open.className = "watch-thread-open";
      open.textContent = thread.title;
      open.title = "Двічі клацніть, щоб перейменувати";
      let openTimer = null;
      open.addEventListener("click", () => {
        clearTimeout(openTimer);
        openTimer = setTimeout(() => {
          watchThreadId = thread.id;
          paintWatch();
        }, 220);
      });
      open.addEventListener("dblclick", (event) => {
        event.preventDefault();
        event.stopPropagation();
        clearTimeout(openTimer);
        const input = document.createElement("input");
        input.type = "text";
        input.className = "tab-name-input";
        input.value = thread.title;
        input.setAttribute("aria-label", "Назва треду");
        open.replaceWith(input);
        input.focus();
        input.select();
        let done = false;
        const finish = (save) => {
          if (done) return;
          done = true;
          const value = input.value.trim();
          if (save && value) thread.title = value.slice(0, 48);
          paintWatch();
        };
        input.addEventListener("keydown", (ev) => {
          ev.stopPropagation();
          if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
          if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
        });
        input.addEventListener("blur", () => finish(true));
        input.addEventListener("click", (ev) => ev.stopPropagation());
      });
      const tools = document.createElement("span");
      tools.className = "watch-thread-tools";
      const archive = document.createElement("button");
      archive.type = "button";
      archive.className = "keyword-tool";
      archive.innerHTML = thread.archived
        ? '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h12M12 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'
        : '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 8h16v11H4zM3 5h18v3H3zM10 12h4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
      archive.title = thread.archived ? "Повернути з архіву" : "Архівувати";
      archive.setAttribute("aria-label", thread.archived ? "Повернути з архіву" : "Архівувати");
      archive.addEventListener("click", (event) => {
        event.stopPropagation();
        if (thread.archived) {
          thread.archived = false;
          watchThreadId = thread.id;
          paintWatch();
          return;
        }
        askConfirm("Архівувати тред «" + thread.title + "»?", "Архівувати", () => archiveThread(thread.id));
      });
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "keyword-tool is-danger";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "Видалити тред");
      remove.addEventListener("click", (event) => {
        event.stopPropagation();
        askConfirm("Видалити тред «" + thread.title + "» назавжди?", "Видалити", () => deleteThread(thread.id));
      });
      tools.append(archive, remove);
      row.append(open, tools);
      return row;
    }

    function applyWatchColumns() {
      const watch = document.getElementById("watch");
      if (!watch) return;
      watch.style.gridTemplateColumns = watchThreadsCollapsed ? "48px minmax(0, 1fr)" : "240px minmax(0, 1fr)";
    }

    function paintThreads() {
      const root = document.getElementById("watch-threads");
      if (!root) return;
      root.replaceChildren();
      root.classList.toggle("is-collapsed", watchThreadsCollapsed);
      applyWatchColumns();
      const head = document.createElement("div");
      head.className = "watch-thread-head";
      const collapse = document.createElement("button");
      collapse.type = "button";
      collapse.className = "watch-threads-toggle";
      collapse.textContent = watchThreadsCollapsed ? "⟩" : "⟨";
      collapse.setAttribute("aria-label", watchThreadsCollapsed ? "Розгорнути треди" : "Згорнути треди");
      collapse.addEventListener("click", () => {
        watchThreadsCollapsed = !watchThreadsCollapsed;
        paintWatch();
      });
      const title = document.createElement("strong");
      title.textContent = "Треди";
      const add = document.createElement("button");
      add.type = "button";
      add.className = "freq-reveal";
      add.textContent = "+";
      add.setAttribute("aria-label", "Новий тред");
      add.addEventListener("click", () => {
        ensureThread();
        if (currentThread() && currentThread().messages.length) {
          const thread = { id: "t" + Date.now(), title: "Новий тред", archived: false, messages: [] };
          watchThreads.unshift(thread);
          watchThreadId = thread.id;
        }
        paintWatch();
        document.getElementById("watch-input").focus();
      });
      head.append(collapse, title, add);
      const list = document.createElement("div");
      list.className = "watch-thread-list";
      const active = watchThreads.filter((thread) => !thread.archived);
      const archived = watchThreads.filter((thread) => thread.archived);
      if (!active.length) {
        const none = document.createElement("p");
        none.className = "watch-thread-empty";
        none.textContent = "Немає тредів";
        list.append(none);
      }
      for (const thread of active) list.append(threadRow(thread));
      if (archived.length) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "watch-archive-toggle";
        toggle.textContent = (watchArchiveOpen ? "▾ " : "▸ ") + "Архів · " + archived.length;
        toggle.addEventListener("click", () => {
          watchArchiveOpen = !watchArchiveOpen;
          paintWatch();
        });
        list.append(toggle);
        if (watchArchiveOpen) {
          for (const thread of archived) list.append(threadRow(thread));
        }
      }
      root.append(head, list);
    }

    function fileChip(file, onRemove) {
      const chip = document.createElement("span");
      chip.className = "watch-file";
      if (file.url && String(file.type || "").startsWith("image/")) {
        const img = document.createElement("img");
        img.src = file.url;
        img.alt = "";
        chip.append(img);
      }
      const name = document.createElement("span");
      name.textContent = file.name;
      chip.append(name);
      if (onRemove) {
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Прибрати файл");
        remove.addEventListener("click", onRemove);
        chip.append(remove);
      }
      return chip;
    }

    function paintPending() {
      const box = document.getElementById("watch-pending");
      if (!box) return;
      box.replaceChildren();
      for (const file of watchPending) {
        box.append(fileChip(file, () => {
          if (file.url) URL.revokeObjectURL(file.url);
          watchPending = watchPending.filter((item) => item.id !== file.id);
          paintPending();
        }));
      }
    }

    function paintWatch() {
      paintThreads();
      paintPending();
      const log = document.getElementById("watch-log");
      const status = document.getElementById("watch-status");
      const stop = document.getElementById("watch-stop");
      const thread = currentThread();
      const messages = thread ? thread.messages : [];
      if (!log) return;
      log.replaceChildren();
      if (!messages.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = '<div class="glyph cut">ꑭ</div><h3>Дозорний</h3><p>Напишіть завдання.</p>';
        log.append(empty);
      }
      for (let index = 0; index < messages.length; index += 1) {
        const item = messages[index];
        if (item.role !== "user") continue;
        const ask = document.createElement("div");
        ask.className = "watch-ask";
        if (item.files && item.files.length) {
          const files = document.createElement("div");
          files.className = "watch-files";
          for (const file of item.files) files.append(fileChip(file));
          ask.append(files);
        }
        if (item.text) ask.append(document.createTextNode(item.text));
        const turn = document.createElement("div");
        turn.className = "watch-turn";
        turn.append(ask);
        const next = messages[index + 1];
        if (next && next.role === "agent") {
          const reply = document.createElement("div");
          reply.className = "watch-reply cut";
          const kicker = document.createElement("div");
          kicker.className = "watch-reply-kicker";
          kicker.textContent = "Дозорний";
          const text = document.createElement("p");
          text.textContent = next.report ? next.report.lead : next.text;
          reply.append(kicker, text);
          if (next.report && next.report.rows.length) {
            const data = document.createElement("dl");
            data.className = "watch-data";
            for (const row of next.report.rows) {
              const line = document.createElement("div");
              const label = document.createElement("dt");
              label.textContent = row.label;
              const value = document.createElement("dd");
              value.textContent = row.value;
              line.append(label, value);
              data.append(line);
            }
            reply.append(data);
          }
          if (next.report && next.report.quotes.length) {
            const evidence = document.createElement("div");
            evidence.className = "watch-evidence";
            const caption = document.createElement("span");
            caption.textContent = "Зі сховища";
            evidence.append(caption);
            for (const quote of next.report.quotes) {
              const line = document.createElement("p");
              line.className = "watch-quote";
              line.textContent = quote;
              evidence.append(line);
            }
            reply.append(evidence);
          }
          turn.append(reply);
          index += 1;
        }
        log.append(turn);
      }
      const runningHere = watchRun && watchRunThread === (thread && thread.id);
      if (status) status.hidden = !runningHere && !watchListening;
      if (stop) stop.hidden = !runningHere;
      if (status && runningHere) status.textContent = "Читає базу";
      if (status && watchListening && !runningHere) status.textContent = "Слухаю";
      log.scrollTop = log.scrollHeight;
    }

    function watchAnalysis(hits) {
      if (!hits.length) return { lead: "По цьому завданню в сховищі нічого немає.", rows: [], quotes: [] };
      const uniq = (key) => [...new Set(hits.map((hit) => hit[key]).filter(Boolean))];
      const rows = [];
      const freqs = uniq("freq");
      const chains = uniq("chain");
      const sources = uniq("source");
      if (freqs.length) rows.push({ label: "Частоти", value: freqs.join(", ") });
      if (chains.length) rows.push({ label: "Ланцюги", value: chains.join("; ") });
      if (sources.length) rows.push({ label: "Джерела", value: sources.join(", ") });
      const quotes = [];
      for (const hit of hits) {
        const quote = String(hit.quote || "").trim();
        if (!quote || quotes.includes(quote)) continue;
        quotes.push(quote.length > 160 ? quote.slice(0, 157) + "…" : quote);
        if (quotes.length === 2) break;
      }
      return { lead: "По " + hits.length + " картках зі сховища.", rows, quotes };
    }

    function askWatch(question, files) {
      const text = String(question || "").trim();
      const attached = (files || []).slice();
      if ((!text && !attached.length) || watchRun) return;
      const thread = ensureThread();
      if (thread.title === "Новий тред") thread.title = (text || attached[0].name).slice(0, 48);
      const run = ++watchRun;
      watchRunThread = thread.id;
      thread.messages.push({ role: "user", text, files: attached });
      setWatchStep("read");
      paintWatch();
      window.setTimeout(() => {
        if (watchRun !== run) return;
        const target = watchThreads.find((item) => item.id === watchRunThread);
        if (!target) {
          watchRun = 0;
          return;
        }
        const hits = text ? watchHits(text).map(watchCardLine) : [];
        const report = text ? watchAnalysis(hits) : { lead: "Файл бачу. Напишіть, що з ним зробити.", rows: [], quotes: [] };
        target.messages.push({ role: "agent", report });
        watchRun = 0;
        setWatchStep(hits.length ? "write" : "");
        paintWatch();
      }, 420);
    }

    const sidebarResize = document.getElementById("sidebar-resize");
    document.addEventListener("selectstart", (event) => {
      if (document.body.classList.contains("is-dragging")) event.preventDefault();
    });
    sidebarResize.addEventListener("pointerdown", (event) => {
      if (document.querySelector(".workspace").classList.contains("is-collapsed")) return;
      event.preventDefault();
      document.body.classList.add("is-dragging");
      window.getSelection()?.removeAllRanges();
      sidebarResize.classList.add("is-dragging");
      sidebarResize.setPointerCapture(event.pointerId);
    });
    sidebarResize.addEventListener("pointermove", (event) => {
      if (!sidebarResize.classList.contains("is-dragging")) return;
      const workspace = document.querySelector(".workspace");
      const width = Math.min(720, Math.max(260, event.clientX - workspace.getBoundingClientRect().left));
      workspace.style.setProperty("--sidebar-width", width + "px");
    });
    const endSidebarDrag = () => {
      sidebarResize.classList.remove("is-dragging");
      document.body.classList.remove("is-dragging");
      window.getSelection()?.removeAllRanges();
    };
    sidebarResize.addEventListener("pointerup", endSidebarDrag);
    sidebarResize.addEventListener("pointercancel", endSidebarDrag);

    document.getElementById("watch-tab").addEventListener("click", () => {
      if (watchOpen) {
        watchOpen = false;
        render();
        return;
      }
      watchOpen = true;
      syncWatch();
      renderTabs();
      paintWatch();
      document.getElementById("watch-input").focus();
    });
    function stopDictation() {
      watchListening = false;
      if (watchRecognition) {
        watchRecognition.onend = null;
        try { watchRecognition.stop(); } catch (error) { /* already stopped */ }
      }
      watchRecognition = null;
      const mic = document.getElementById("watch-mic");
      if (mic) mic.classList.remove("is-on");
      const status = document.getElementById("watch-status");
      if (status && !watchRun) status.hidden = true;
    }

    function toggleDictation() {
      if (watchListening) {
        stopDictation();
        return;
      }
      const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
      const status = document.getElementById("watch-status");
      if (!SpeechApi) {
        if (status) {
          status.hidden = false;
          status.textContent = "Браузер не транскрибує";
        }
        return;
      }
      const recognition = new SpeechApi();
      recognition.lang = "uk-UA";
      recognition.continuous = true;
      recognition.interimResults = true;
      const input = document.getElementById("watch-input");
      watchDictateBase = input.value;
      recognition.onresult = (event) => {
        let spoken = "";
        for (const result of event.results) spoken += result[0].transcript;
        input.value = (watchDictateBase + " " + spoken).trim();
      };
      recognition.onerror = () => {
        stopDictation();
        if (status) {
          status.hidden = false;
          status.textContent = "Немає доступу до мікрофона";
        }
      };
      recognition.onend = () => {
        if (watchListening) stopDictation();
      };
      watchRecognition = recognition;
      watchListening = true;
      document.getElementById("watch-mic").classList.add("is-on");
      if (status) {
        status.hidden = false;
        status.textContent = "Слухаю";
      }
      recognition.start();
    }

    document.getElementById("watch-stop").addEventListener("click", () => {
      watchRun = 0;
      setWatchStep("");
      paintWatch();
    });
    document.getElementById("watch-attach").addEventListener("click", () => {
      document.getElementById("watch-file").click();
    });
    document.getElementById("watch-file").addEventListener("change", () => {
      const input = document.getElementById("watch-file");
      for (const file of input.files || []) {
        watchPending.push({
          id: "f" + Date.now() + Math.random().toString(16).slice(2),
          name: file.name,
          type: file.type,
          url: URL.createObjectURL(file),
        });
      }
      input.value = "";
      paintPending();
    });
    document.getElementById("watch-mic").addEventListener("click", toggleDictation);
    document.getElementById("watch-form").addEventListener("submit", (event) => {
      event.preventDefault();
      stopDictation();
      const input = document.getElementById("watch-input");
      const files = watchPending.slice();
      watchPending = [];
      askWatch(input.value, files);
      input.value = "";
      paintPending();
    });

    document.getElementById("sidebar-toggle").addEventListener("click", () => {
      const workspace = document.querySelector(".workspace");
      const closed = workspace.classList.toggle("is-collapsed");
      document.getElementById("sidebar-toggle").setAttribute("aria-label", closed ? "Розгорнути фільтр" : "Згорнути фільтр");
    });

    document.getElementById("gate-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const callsign = document.getElementById("callsign-input").value.trim() || "Дрозд";
      const badge = document.getElementById("callsign");
      badge.hidden = false;
      badge.textContent = callsign;
      const value = document.getElementById("password").value.trim();
      const error = document.getElementById("gate-error");
      if (!value) {
        error.classList.add("show");
        return;
      }
      error.classList.remove("show");
      gate.classList.add("off");
      desk.classList.add("on");
      render();
      startTicker();
    });
    document.getElementById("confirm-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const action = confirmAction;
      closeConfirm();
      if (action) action();
    });
    document.getElementById("confirm-cancel").addEventListener("click", closeConfirm);
    document.getElementById("confirm").addEventListener("click", (event) => {
      if (event.target.id === "confirm") closeConfirm();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !document.getElementById("confirm").hidden) closeConfirm();
    });

    document.getElementById("leave").addEventListener("click", () => {
      stopTicker();
      desk.classList.remove("on");
      gate.classList.remove("off");
      document.getElementById("password").value = "";
      document.getElementById("callsign").hidden = true;
    });
  </script>

</body>
</html>
