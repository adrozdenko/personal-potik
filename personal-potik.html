<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ПОТІК · особистий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface-0: #080808;
      --surface-1: #0d0d0d;
      --surface-2: #121212;
      --surface-3: #181818;
      --line: #292929;
      --line-strong: #484848;
      --text: #fff;
      --text-muted: #b8b2a9;
      --text-dim: #817b73;
      --orange: #f6921e;
      --orange-hover: #e16709;
      --beige: #d6b588;
      --amber-soft: #2e1b0c;
      --danger: #e65e45;
      --danger-soft: #32130e;
      --danger-text: #ffb4a7;
      --success: #90ad65;
      --signal-green: #111a0b;
      --cut: 12px;
      --cut-sm: 7px;
      --display: "Oswald", "Arial Narrow", sans-serif;
      --body: "Mulish", system-ui, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      --shape: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
      --shape-sm: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        linear-gradient(135deg, transparent 0 48%, rgba(214,181,136,.025) 49% 51%, transparent 52%) 0 0 / 96px 96px,
        radial-gradient(circle at 78% 14%, rgba(246,146,30,.045), transparent 30%),
        var(--bg);
      color: var(--text);
      font: 14px/1.45 var(--body);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) #080808;
    }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: #080808; }
    *::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border: 2px solid #080808;
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--orange); }
    *::-webkit-scrollbar-corner { background: #080808; }
    h1, h2, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

    .gate {
      display: grid;
      min-height: 100%;
      place-items: center;
      padding: 24px;
    }
    .cut {
      --cut-size: var(--cut);
      --cut-border-color: var(--line-strong);
      position: relative;
      background-color: var(--surface-1);
      background-image:
        linear-gradient(to bottom right, transparent 50%, var(--cut-border-color) 50% calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to bottom right, transparent calc(50% - 1px), var(--cut-border-color) calc(50% - 1px) 50%, transparent 50%);
      background-repeat: no-repeat;
      background-position: left top, right bottom;
      background-size: var(--cut-size) var(--cut-size), var(--cut-size) var(--cut-size);
      background-origin: border-box;
      background-clip: border-box;
    }
    .cut::before,
    .cut::after {
      position: absolute;
      z-index: 6;
      width: calc(var(--cut-size) * 1.4142);
      height: 1px;
      background: var(--cut-border-color);
      content: "";
      pointer-events: none;
    }
    .cut::before {
      top: calc(var(--cut-size) / 2 - .5px);
      left: calc(var(--cut-size) / 2);
      transform: translateX(-50%) rotate(-45deg);
    }
    .cut::after {
      right: calc(var(--cut-size) / 2);
      bottom: calc(var(--cut-size) / 2 - .5px);
      transform: translateX(50%) rotate(-45deg);
    }
    .gate-card {
      width: min(420px, 100%);
      border: 1px solid var(--line-strong);
      clip-path: var(--shape);
      box-shadow: 0 18px 44px rgba(0,0,0,.48);
    }
    .gate-card header, .desk-top, .pane header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #000;
    }
    .mark {
      display: block;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { display: flex; align-items: center; height: 22px; margin: 0; line-height: 22px; }
    .callsign {
      margin: 0 4px 0 12px;
      color: var(--beige);
      font: 600 16px/1 var(--display);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .brand h1, .pane h2 {
      font-family: var(--display);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .brand h1 { font-size: 22px; }
    .eyebrow {
      color: var(--beige);
      font: 700 9px/1.2 var(--mono);
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .gate-body, .pane-body { padding: 18px; }
    .gate-body p { color: var(--text-muted); font-size: 13px; }
    label { display: grid; gap: 6px; margin-top: 16px; }
    label span { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    input[type="password"], input[type="text"], input[type="search"], select {
      appearance: none;
      -webkit-appearance: none;
      height: 36px;
      width: 100%;
      --cut-size: 7px;
      --cut-border-color: var(--line-strong);
      border: 1px solid var(--cut-border-color);
      border-top-width: 1px;
      border-radius: 0;
      background-color: #080808;
      background-image:
        linear-gradient(to bottom right, transparent 50%, var(--cut-border-color) 50% calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to bottom right, transparent calc(50% - 1px), var(--cut-border-color) calc(50% - 1px) 50%, transparent 50%);
      background-repeat: no-repeat;
      background-position: left top, right bottom;
      background-size: 7px 7px, 7px 7px;
      background-origin: border-box;
      background-clip: border-box;
      color: var(--text);
      padding: 0 12px;
      font: 600 12px var(--body);
      letter-spacing: .02em;
      outline: 0;
      clip-path: var(--shape-sm);
    }
    select {
      padding-right: 32px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--orange) 50%),
        linear-gradient(135deg, var(--orange) 50%, transparent 50%);
      background-position: calc(100% - 18px) 16px, calc(100% - 13px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      text-transform: uppercase;
      font-family: var(--display);
      letter-spacing: .06em;
    }
    select option {
      background: #080808;
      color: var(--text);
      font-family: var(--body);
      text-transform: none;
    }
    input::-webkit-search-decoration,
    input::-webkit-search-cancel-button,
    input::-webkit-search-results-button,
    input::-webkit-search-results-decoration { display: none; appearance: none; }
    input::placeholder { color: var(--text-dim); font-weight: 600; letter-spacing: .02em; }
    input:focus { --cut-border-color: var(--orange); border-color: var(--orange); }
    .row { display: flex; gap: 8px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .button--primary { border-color: var(--orange); background: var(--orange); color: #000; }
    .button--primary:hover { background: var(--orange-hover); }
    .button--ghost { background: transparent; color: var(--text-muted); }
    .button--danger { border-color: var(--danger); color: var(--danger-text); }
    .button--danger:hover { background: var(--danger-soft); }
    .confirm {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .72);
    }
    .confirm[hidden] { display: none; }
    .confirm-card {
      width: min(420px, 100%);
      padding: 18px;
      border: 1px solid var(--line-strong);
      background: #080808;
    }
    .confirm-card p { margin: 0; font-size: 14px; line-height: 1.45; }
    .confirm-card .row { justify-content: flex-end; margin-top: 16px; }
    .gate-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    .hint { margin-top: 12px; color: var(--text-dim); font-size: 11px; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid var(--danger);
      background: var(--danger-soft);
      color: var(--danger-text);
      font-size: 12px;
    }
    .error.show { display: block; }

    .desk { display: none; height: 100%; grid-template-rows: 64px auto 1fr; }
    .desk.on { display: grid; }
    .gate.off { display: none; }
    .desk-top { min-height: 64px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 11px; }
    .dot { width: 7px; height: 7px; background: var(--success); box-shadow: 0 0 0 2px #111a0b; }
    .workspace { display: grid; grid-template-columns: var(--sidebar-width, 340px) 1fr; min-height: 0; }
    .workspace.is-collapsed { grid-template-columns: 48px 1fr; }
    .workspace.is-collapsed #filters,
    .workspace.is-collapsed #filter-eyebrow,
    .workspace.is-collapsed #match-count,
    .workspace.is-collapsed aside header > div { display: none; }
    .workspace.is-collapsed aside header {
      display: grid;
      grid-template-columns: 1fr;
      place-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      padding: 0;
    }
    .workspace.is-collapsed #sidebar-toggle { margin-inline: auto; }
    #sidebar-toggle {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      padding: 0;
    }
    #sidebar-toggle svg { display: none; }
    .workspace.is-collapsed #sidebar-toggle .sidebar-toggle-open { display: none; }
    .workspace.is-collapsed #sidebar-toggle svg { display: block; }
    aside.pane { position: relative; }
    .sidebar-resize {
      position: absolute;
      top: 0;
      right: -3px;
      z-index: 3;
      width: 6px;
      height: 100%;
      cursor: col-resize;
    }
    .sidebar-resize::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 2px;
      width: 1px;
      background: var(--line-strong);
    }
    .sidebar-resize:hover::after, .sidebar-resize.is-dragging::after { background: var(--orange); }
    .workspace.is-collapsed .sidebar-resize { display: none; }
    .boards { display: grid; min-width: 0; min-height: 0; }
    .boards[data-n="1"] { grid-template-columns: 1fr; }
    .boards[data-n="2"] { grid-template-columns: 1fr 1fr; }
    .boards[data-n="3"] { grid-template-columns: 1fr 1fr 1fr; }
    .boards[data-n="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .boards[data-n="5"], .boards[data-n="6"] { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .board { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .board.on { box-shadow: inset 0 1px var(--orange); }
    .board header { min-height: 36px; padding: 6px 10px; background: #000; }
    .board header h2 { font-size: 14px; cursor: pointer; }
    .board.on header h2 { color: var(--orange); }
    .board .pane-body { display: flex; flex: 1; flex-direction: column; min-height: 0; overflow: auto; }
    .board .feed { display: flex; flex: 1; flex-direction: column; min-height: 0; }
    .tab-split {
      --cut-size: 7px;
      --cut-border-color: var(--line-strong);
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      height: auto;
      margin: 0;
      padding: 8px 16px;
      border: 1px solid var(--cut-border-color);
      border-top-width: 1px;
      background-color: #080808;
      clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    }
    .tab-split::before,
    .tab-split::after {
      position: absolute;
      z-index: 3;
      width: 9.9px;
      height: 1px;
      background: var(--cut-border-color);
      content: "";
      pointer-events: none;
    }
    .tab-split::before {
      top: 3px;
      left: 3.5px;
      transform: translateX(-50%) rotate(-45deg);
    }
    .tab-split::after {
      right: 3.5px;
      bottom: 3px;
      transform: translateX(50%) rotate(-45deg);
    }
    .tab-split.on { --cut-border-color: var(--orange); border-color: var(--orange); box-shadow: none; }
    .tab-split.drop { border-color: var(--orange); background: var(--amber-soft); }
    .tab-split-label { color: var(--beige); font: 700 9px var(--mono); letter-spacing: .12em; }
    .tab-mini {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      font: 700 11px var(--body);
      cursor: grab;
    }
    .tab-mini.on { box-shadow: inset 0 -2px var(--orange); }
    .tabs.drop { outline: 1px dashed var(--orange); outline-offset: -4px; }
    .pane { min-height: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .pane:last-child { border-right: 0; }
    aside.pane header { min-height: 48px; padding: 10px 14px; }
    .pane-body { flex: 1; overflow: auto; }
    .facet { border: 1px solid var(--line); background: var(--surface-0); margin-bottom: 12px; }
    .facet.is-open.is-active,
    .facet.is-open:focus-within { border-color: color-mix(in srgb, var(--orange) 42%, var(--line-strong)); }
    .facet header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 44px;
      padding: 4px 6px 4px 10px;
      background: #000;
      cursor: pointer;
    }
    .facet header span { color: var(--beige); font: 700 13px var(--mono); letter-spacing: .08em; }
    .facet header .button { min-height: 26px; padding: 0 8px; font-size: 10px; }
    .facet-actions { display: flex; align-items: center; gap: 6px; }
    .facet-actions .freq-reveal { width: 28px; height: 28px; font-size: 18px; }
    .facet-lead {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .facet-chevron {
      color: var(--text-dim);
      font: 700 14px/1 var(--body);
      transition: transform 160ms cubic-bezier(.2, .75, .25, 1);
    }
    .facet.is-open .facet-chevron { color: var(--orange); transform: rotate(90deg); }
    .facet-count { color: var(--orange); font: 700 9px var(--mono); }
    .facet:not(.is-open) .pick,
    .facet:not(.is-open) .facet-note { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips:empty { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border: 1px solid #6c5a43;
      background: var(--amber-soft);
      color: var(--beige);
      font: 700 10px var(--mono);
    }
    .chip button {
      border: 0;
      background: transparent;
      color: var(--text-dim);
      padding: 0;
      line-height: 1;
    }
    .pick { display: grid; gap: 8px; padding: 10px; }
    .pick-list {
      display: grid;
      align-self: start;
      width: 100%;
      height: auto;
      max-height: var(--list-height, 168px);
      overflow: auto;
      border: 1px solid var(--line);
      background: #080808;
    }
    .unit-tree { --unit-step: 14px; --list-height: 280px; }
    .freq-tree .unit-tree-select,
    .keyword-tree .unit-tree-select { grid-template-columns: 14px minmax(0, 1fr) auto; }
    .keyword-tree .unit-tree-row--branch { grid-template-columns: 16px minmax(0, 1fr) auto; }
    .keyword-tools { z-index: 1; display: flex; align-items: center; gap: 2px; }
    .keyword-tool {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-dim);
      font: 700 14px/1 var(--body);
    }
    .keyword-tool:hover { color: var(--orange); }
    .keyword-tool.is-danger:hover { color: var(--danger-text); }
    .keyword-word-add {
      display: flex;
      gap: 6px;
      padding: 6px 8px 6px 28px;
      border-bottom: 1px solid var(--line);
    }
    .keyword-word-add input { flex: 1; width: auto; min-width: 0; }
    .source-chat {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 0 8px 0 calc(7px + var(--unit-depth, 1) * 14px);
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .source-chat:hover { background: var(--surface-2); }
    .source-empty {
      padding: 8px 8px 8px 28px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .unit-tree-count {
      color: var(--beige);
      font: 700 9px var(--mono);
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .unit-tree-row--net .unit-tree-select strong {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    body.is-dragging,
    body.is-dragging * {
      user-select: none;
      -webkit-user-select: none;
    }
    .facet-resize {
      display: none;
      height: 22px;
      margin-top: -10px;
      cursor: ns-resize;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background: #000;
    }
    .facet.is-open .facet-resize { display: block; }
    .facet-resize::after {
      content: "";
      display: block;
      height: 1px;
      margin-top: 10px;
      background: var(--line-strong);
    }
    .facet-resize:hover,
    .facet-resize.is-dragging { background: color-mix(in srgb, var(--orange) 14%, #000); }
    .facet-resize:hover::after,
    .facet-resize.is-dragging::after { background: var(--orange); }
    .unit-tree-row {
      position: relative;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      gap: 3px;
      min-height: 36px;
      padding: 0 7px 0 calc(7px + var(--unit-depth, 0) * var(--unit-step));
      border-bottom: 1px solid var(--line);
    }
    .unit-tree-row--nested::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(5px + var(--unit-depth) * var(--unit-step));
      border-left: 1px solid #3a3a3a;
      content: "";
      pointer-events: none;
    }
    .unit-tree-row--nested::after {
      position: absolute;
      top: 50%;
      left: calc(5px + var(--unit-depth) * var(--unit-step));
      width: 7px;
      border-top: 1px solid #3a3a3a;
      content: "";
      pointer-events: none;
    }
    .unit-tree-row--selected { background: linear-gradient(90deg, rgba(246,146,30,.14), transparent 78%); box-shadow: inset 2px 0 var(--orange); }
    .unit-tree-row--selected .pick-mark { border-color: var(--orange); background: var(--orange); }
    .pick-mark.partial {
      border-color: var(--orange);
      background: linear-gradient(var(--orange), var(--orange)) center / 8px 2px no-repeat;
    }
    .unit-tree-toggle, .unit-tree-spacer { z-index: 1; width: 16px; height: 22px; }
    .unit-tree-toggle {
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-dim);
      font: 700 12px/1 var(--body);
    }
    .unit-tree-toggle--open { color: var(--orange); transform: rotate(90deg); }
    .unit-tree-select {
      z-index: 1;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 32px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .unit-tree-select strong, .unit-tree-select small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unit-tree-select strong { font-size: 12px; font-weight: 700; }
    .unit-tree-row--branch .unit-tree-select strong { color: #f3eee7; }
    .unit-tree-select small { margin-top: 2px; color: var(--text-dim); font: 700 9px var(--mono); }
    .pick-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 0 8px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .pick-row:last-child { border-bottom: 0; }
    .pick-row:hover { background: var(--surface-2); }
    .pick-row.on { background: var(--amber-soft); box-shadow: inset 2px 0 var(--orange); }

    function fold(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
    }

      return filters[key].some((item) => fold(item) === fold(value));

    function buildUnitTree(paths) {
      const nodes = new Map();
      for (const path of paths) {
        path.forEach((label, index) => {
          const nodePath = path.slice(0, index + 1);
          const id = nodePath.join(" > ");
          if (!nodes.has(id)) {
            nodes.set(id, { id, label, path: nodePath, depth: index, children: [] });
          }
        });
      }
      const roots = [];
      for (const node of nodes.values()) {
        if (!node.depth) roots.push(node);
        else nodes.get(node.path.slice(0, -1).join(" > ")).children.push(node);
      }
      const sortNodes = (list) => {
        list.sort((left, right) => left.label.localeCompare(right.label, "uk", { numeric: true, sensitivity: "base" }));
        list.forEach((node) => sortNodes(node.children));
      };
      sortNodes(roots);
      return roots;
    }

    function absorbLooseFormations() {
      const known = new Set();
      for (const path of UNIT_PATHS) {
        for (const label of path) known.add(fold(label));
      }
      for (const row of CATALOG.frequencies) {
        const label = String(row.formation || "").trim();
        if (!label || known.has(fold(label))) continue;
        known.add(fold(label));
        UNIT_PATHS.push([label]);
      }
    }

    absorbLooseFormations();
    let unitRoots = buildUnitTree(UNIT_PATHS);
    const unitNodes = [];
    (function collect(list) { for (const node of list) { unitNodes.push(node); collect(node.children); } })(unitRoots);

    function rebuildUnitTree() {
      unitRoots = buildUnitTree(UNIT_PATHS);
      unitNodes.length = 0;
      (function collect(list) {
        for (const node of list) {
          unitNodes.push(node);
          collect(node.children);
        }
      })(unitRoots);
    }

    function bindFrequencyPaths() {
      const owners = new Map();
      for (const node of unitNodes) {
        const key = fold(node.label);
        if (!owners.has(key)) owners.set(key, []);
        owners.get(key).push(node);
      }
      for (const row of CATALOG.frequencies) {
        if (row.path && unitNodes.some((node) => fold(node.id) === fold(row.path))) continue;
        const list = owners.get(fold(row.formation)) || [];
        if (list.length !== 1) continue;
        row.path = list[0].id;
        row.formation = list[0].label;
      }
    }

    bindFrequencyPaths();
    const expanded = new Set(unitNodes.filter((node) => node.children.length).map((node) => node.id));
    const freqExpanded = new Set();

    function branchMatches(node, query) {
      if (!query) return true;
      if (fold(node.path.join(" ")).includes(query) || fold(node.label).includes(query)) return true;
      return node.children.some((child) => branchMatches(child, query));
    }

    function visibleTree(search) {
      const query = fold(search);
      const out = [];
      const visit = (node) => {
        const own = !query || fold(node.path.join(" ") + " " + node.label).includes(query);
        const childHit = node.children.some((child) => branchMatches(child, query));
        if (query && !own && !childHit) return;
        out.push(node);
        const open = query ? own || childHit : expanded.has(node.id);
        if (!open) return;
        for (const child of node.children) {
          if (!query || own || branchMatches(child, query)) visit(child);
        }
      };
      unitRoots.forEach(visit);
      return out;
    }

    function subtreeLabels(pathId) {
      const node = unitNodes.find((item) => fold(item.id) === fold(pathId));
      if (!node) return [pathId];
      const labels = [];
      const walk = (item) => {
        labels.push(item.label);
        item.children.forEach(walk);
      };
      walk(node);
      return labels;
    }

    function nodeById(id) {
      return unitNodes.find((item) => fold(item.id) === fold(id));
    }

    function cleanLabel(raw) {
      return String(raw || "").trim().replace(/\s+/g, " ");
    }

    function rewriteId(id, oldId, newId) {
      if (!id) return id;
      if (id === oldId) return newId;
      if (id.startsWith(oldId + " > ")) return newId + id.slice(oldId.length);
      return id;
    }

    function rewriteSet(set, oldId, newId) {
      for (const item of [...set]) {
        const next = rewriteId(item, oldId, newId);
        if (next !== item) {
          set.delete(item);
          set.add(next);
        }
      }
    }

    function rewriteTreeRefs(oldId, newId, exactLabel) {
      for (const row of CATALOG.frequencies) {
        if (!row.path || (row.path !== oldId && !row.path.startsWith(oldId + " > "))) continue;
        if (exactLabel && row.path === oldId) row.formation = exactLabel;
        row.path = rewriteId(row.path, oldId, newId);
      }
      filters.formation = filters.formation.map((item) => rewriteId(item, oldId, newId));
      rewriteSet(expanded, oldId, newId);
      rewriteSet(freqExpanded, oldId, newId);
      rewriteSet(freqTargetExpanded, oldId, newId);
      freqTargetId = rewriteId(freqTargetId, oldId, newId);
      formationChildParent = rewriteId(formationChildParent, oldId, newId);
      freqAddParent = rewriteId(freqAddParent, oldId, newId);
    }

    function claimFrequencies(node) {
      const same = unitNodes.filter((item) => fold(item.label) === fold(node.label));
      if (same.length !== 1) return;
      for (const row of CATALOG.frequencies) {
        if (row.path && nodeById(row.path)) continue;
        if (fold(row.formation) !== fold(node.label)) continue;
        row.path = node.id;
        row.formation = node.label;
      }
    }

    function addFormation(parentId, raw) {
      const label = cleanLabel(raw);
      if (!label || label.includes(">")) return;
      const parent = parentId ? nodeById(parentId) : null;
      if (parentId && !parent) return;
      const movable = unitRoots.find((item) => fold(item.label) === fold(label));
      if (parent && movable && movable.id !== parent.id && !parent.id.startsWith(movable.id + " > ")) {
        askConfirm("Перенести " + movable.label + " під " + parent.label + "?", "Перенести", () => {
          reparentFormation(movable.id, parent.id);
          formationChildParent = "";
          formationAddOpen = false;
        });
        return;
      }
      const siblings = parent ? parent.children : unitRoots;
      if (siblings.some((item) => fold(item.label) === fold(label))) return;
      const path = parent ? parent.path.concat(label) : [label];
      UNIT_PATHS.push(path);
      rebuildUnitTree();
      const node = nodeById(path.join(" > "));
      if (node) claimFrequencies(node);
      if (parent) {
        expanded.add(parent.id);
        freqExpanded.add(parent.id);
      }
      formationAddOpen = false;
      formationChildParent = "";
      render();
    }

    function reparentFormation(id, parentId) {
      const node = nodeById(id);
      const parent = nodeById(parentId);
      if (!node || !parent) return;
      if (parent.id === id || parent.id.startsWith(id + " > ")) return;
      const oldId = node.id;
      const newId = parent.path.concat(node.label).join(" > ");
      const next = [];
      for (const path of UNIT_PATHS) {
        const current = path.join(" > ");
        if (current === oldId || current.startsWith(oldId + " > ")) next.push(parent.path.concat(path.slice(node.depth)));
        else next.push(path);
      }
      UNIT_PATHS.length = 0;
      UNIT_PATHS.push(...next);
      rewriteTreeRefs(oldId, newId);
      rebuildUnitTree();
      expanded.add(parent.id);
      expanded.add(newId);
      freqExpanded.add(parent.id);
      freqExpanded.add(newId);
      render();
    }

    function renameFormation(id, raw) {
      const label = cleanLabel(raw);
      const node = nodeById(id);
      if (!node || !label || label.includes(">") || fold(label) === fold(node.label)) return;
      const parentPath = node.path.slice(0, -1);
      const siblings = parentPath.length ? (nodeById(parentPath.join(" > "))?.children || []) : unitRoots;
      if (siblings.some((item) => item.id !== node.id && fold(item.label) === fold(label))) return;
      const newId = parentPath.concat(label).join(" > ");
      for (const path of UNIT_PATHS) {
        const current = path.join(" > ");
        if (current === id || current.startsWith(id + " > ")) path[node.depth] = label;
      }
      rewriteTreeRefs(id, newId, label);
      rebuildUnitTree();
      expanded.add(newId);
      render();
    }

    function removeFormation(id) {
      const node = nodeById(id);
      if (!node) return;
      const parentPath = node.path.slice(0, -1);
      for (let index = UNIT_PATHS.length - 1; index >= 0; index -= 1) {
        const current = UNIT_PATHS[index].join(" > ");
        if (current === id || current.startsWith(id + " > ")) UNIT_PATHS.splice(index, 1);
      }
      if (parentPath.length) {
        const parentId = parentPath.join(" > ");
        const still = UNIT_PATHS.some((path) => {
          const current = path.join(" > ");
          return current === parentId || current.startsWith(parentId + " > ");
        });
        if (!still) UNIT_PATHS.push(parentPath.slice());
      }
      for (const row of CATALOG.frequencies) {
        if (!row.path || (row.path !== id && !row.path.startsWith(id + " > "))) continue;
        if (parentPath.length) {
          row.path = parentPath.join(" > ");
          row.formation = parentPath[parentPath.length - 1];
        } else {
          row.path = "";
          row.formation = "";
        }
      }
      filters.formation = filters.formation.filter((item) => item !== id && !item.startsWith(id + " > "));
      for (const set of [expanded, freqExpanded, freqTargetExpanded]) {
        for (const item of [...set]) {
          if (item === id || item.startsWith(id + " > ")) set.delete(item);
        }
      }
      if (freqTargetId === id || freqTargetId.startsWith(id + " > ")) freqTargetId = parentPath.join(" > ");
      if (formationChildParent === id || formationChildParent.startsWith(id + " > ")) formationChildParent = "";
      if (freqAddParent === id || freqAddParent.startsWith(id + " > ")) freqAddParent = "";
      rebuildUnitTree();
      render();
    }

    function descendantIds(node) {
      return [node.id, ...node.children.flatMap(descendantIds)];
    }

    function isCovered(key, node) {
      if (selected(key, node.id)) return true;
      for (let index = 1; index < node.path.length; index += 1) {
        if (selected(key, node.path.slice(0, index).join(" > "))) return true;
      }
      return false;
    }

    function hasPartial(key, node) {
      if (isCovered(key, node)) return false;
      return node.children.some((child) => isCovered(key, child) || hasPartial(key, child));
    }

    function keptBeside(ancestor, dropped) {
      const drop = new Set(descendantIds(dropped).map(fold));
      const kept = [];
      const walk = (item) => {
        if (drop.has(fold(item.id))) return;
        if (descendantIds(item).some((id) => drop.has(fold(id)))) item.children.forEach(walk);
        else kept.push(item.id);
      };
      ancestor.children.forEach(walk);
      return kept;
    }

    function collapseUp(key, node) {
      if (node.path.length < 2) return;
      const parent = nodeById(node.path.slice(0, -1).join(" > "));
      if (!parent || !parent.children.every((child) => isCovered(key, child))) return;
      const drop = new Set(parent.children.flatMap(descendantIds).map(fold));
      filters[key] = filters[key].filter((id) => !drop.has(fold(id)));
      if (!selected(key, parent.id)) filters[key].push(parent.id);
      collapseUp(key, parent);
    }

    function toggleBranch(key, nodeId) {
      const node = nodeById(nodeId);
      if (!node) return;
      if (isCovered(key, node)) {
        const cover = selected(key, node.id)
          ? node.id
          : node.path.slice(0, -1).map((_, index) => node.path.slice(0, index + 1).join(" > ")).reverse().find((id) => selected(key, id));
        const coverNode = cover ? nodeById(cover) : null;
        filters[key] = filters[key].filter((id) => fold(id) !== fold(cover));
        if (coverNode && cover !== node.id) {
          for (const id of keptBeside(coverNode, node)) {
            if (!selected(key, id)) filters[key].push(id);
          }
        }
        const drop = new Set(descendantIds(node).map(fold));
        filters[key] = filters[key].filter((id) => !drop.has(fold(id)));
      } else {
        const drop = new Set(descendantIds(node).map(fold));
        filters[key] = filters[key].filter((id) => !drop.has(fold(id)));
        filters[key].push(node.id);
        collapseUp(key, node);
      }
      render();
    }

    function shortPath(value) {
      const parts = String(value).split(" > ");
      return parts[parts.length - 1] || value;
    }

    function netsOf(name) {
      const folded = fold(name);
      return CATALOG.frequencies
        .filter((row) => fold(row.formation) === folded)
        .map((row) => row.freq);
    }

    function positive(set) {
      const source = set || filters;
      return source.formation.length || source.freq.length || source.names.length || source.sources.length || source.keywords.length;
    }

    function matchesSet(set, card) {
      if (!positive(set)) return false;
      const units = card.units.map(fold);
      const formationOn = !set.formation.length || set.formation.some((pathId) => {
        return subtreeLabels(pathId).some((label) => units.includes(fold(label)) || netsOf(label).includes(card.freq));
      });
      const freqOn = !set.freq.length || set.freq.includes(card.freq);
      const nameOn = !set.names.length || set.names.some((name) => nameInCard(card, name));
      const sourceOn = !set.sources.length || set.sources.some((label) => sourceHits(card, label));
      const keywordOn = !set.keywords.length || set.keywords.some((word) => keywordInCard(card, word));
      return formationOn && freqOn && nameOn && sourceOn && keywordOn;
    }

    function matches(card) {
      return matchesSet(filters, card);
    }

    function hitCount(flow) {
      return cards.filter((card) => matchesSet(flow.filters, card)).length;

    function unreadCount(flow) {
      if (!positive(flow.filters)) return 0;
      return cards.filter((card) => matchesSet(flow.filters, card) && !flow.seen.has(card.id)).length;
    }

    function markSeen(flow) {
      for (const card of cards) {
        if (matchesSet(flow.filters, card)) flow.seen.add(card.id);

    function cardSource(card) {

      return line ? line.replace(/^Джерело:\s*/, "") : "";

    function sourceCore(label) {

      return label;

    const keywordGroups = [

        if (word.startsWith("політик") || word.startsWith("политик")) return false;
        if (word === stem || word === label) return true;
        return stem.length >= 4 && word.startsWith(stem);

    function visibleKeywordEntries(search) {

        if (queryText && !own && !words.length) continue;
        const open = queryText ? Boolean(own || words.length) : keywordExpanded.has(group.id);
        out.push({ kind: "group", group, open });
        if (open && keywordWordGroup === group.id) out.push({ kind: "add", group });

      const still = keywordGroups.some((item) => item.words.some((word) => fold(word.label) === fold(value)));

    function removeKeywordGroup(id) {

      filters.keywords = filters.keywords.filter((word) => {

    function scopedFrequencies() {

    function byFreq(left, right) {
      const a = Number(left.freq);
      const b = Number(right.freq);
      if (Number.isFinite(a) && Number.isFinite(b) && a !== b) return a - b;
      return String(left.freq).localeCompare(String(right.freq), "uk", { numeric: true });

    let freqTargetId = "";
    let freqAddOpen = false;
    let formationAddOpen = false;
    let formationChildParent = "";
    let freqAddParent = "";
    let pendingFocus = "";
    let keywordAddOpen = false;

    const freqTargetExpanded = new Set();

    function normalizeFreq(raw) {

      if (!/^\d{2,3}(\.\d{1,4})?$/.test(text)) return "";
      const [whole, frac = ""] = text.split(".");
      return whole + "." + (frac + "0000").slice(0, 4);

    function extraFormationNodes() {
      const known = new Set(unitNodes.map((node) => fold(node.label)));
      const extras = [];
      for (const row of CATALOG.frequencies) {

        known.add(fold(row.formation));
        extras.push({
          id: "label:" + row.formation,
          label: row.formation,
          path: [row.formation],
          depth: 0,

    function freqTargetLabel() {
      const node = nodeById(freqTargetId);
      if (node) return node.label;

    function revealFreqTarget(id) {

    function revealFreqNode(node) {
      for (let index = 1; index <= node.path.length; index += 1) {
        freqExpanded.add(node.path.slice(0, index).join(" > "));
      }
    }

    function addFrequency(formationId, raw) {
      const freq = normalizeFreq(raw);
      const node = nodeById(formationId);
      if (!node || !freq) return;
      const exists = CATALOG.frequencies.some((row) => (
        fold(row.freq) === fold(freq) && fold(row.path || "") === fold(node.id)
      ));
      if (!exists) CATALOG.frequencies.push({ freq, formation: node.label, lean: "", path: node.id, custom: true });
      if (!selected("freq", freq)) filters.freq.push(freq);
      revealFreqNode(node);
      freqAddParent = "";
      freqAddOpen = false;
      query.freq = "";
      render();
    }

    let confirmAction = null;

    function askConfirm(message, okLabel, action) {
      confirmAction = action;
      document.getElementById("confirm-text").textContent = message;
      document.getElementById("confirm-ok").textContent = okLabel;
      document.getElementById("confirm").hidden = false;
    }

    function closeConfirm() {
      confirmAction = null;
      document.getElementById("confirm").hidden = true;
    }

    function removeFrequency(row) {
      const index = CATALOG.frequencies.indexOf(row);
      if (index >= 0) CATALOG.frequencies.splice(index, 1);
      if (!CATALOG.frequencies.some((item) => fold(item.freq) === fold(row.freq))) {
        filters.freq = filters.freq.filter((item) => fold(item) !== fold(row.freq));
      }
      render();
    }

    function buildFreqTree(rows) {
      const byPath = new Map();
      const loose = [];
      for (const row of rows) {
        if (row.path && nodeById(row.path)) {
          const key = fold(row.path);
          if (!byPath.has(key)) byPath.set(key, []);
          byPath.get(key).push(row);
        } else loose.push(row);
      }
      const decorate = (node) => ({
        id: node.id,
        label: node.label,
        depth: node.depth,
        freqs: (byPath.get(fold(node.id)) || []).slice().sort(byFreq),
        children: node.children.map(decorate),
      });
      const roots = unitRoots.map(decorate);
      const unlabeled = [];
      const byName = new Map();
      for (const row of loose) {
        const label = String(row.formation || "").trim();
        if (!label) unlabeled.push(row);
        else {
          if (!byName.has(fold(label))) byName.set(fold(label), { label, rows: [] });
          byName.get(fold(label)).rows.push(row);
        }
      }
      for (const group of byName.values()) {
        roots.push({
          id: "freq:" + group.label,
          label: group.label,
          depth: 0,
          freqs: group.rows.slice().sort(byFreq),
          children: [],
        });
      }
      if (unlabeled.length) {
        roots.push({
          id: "freq:none",
          label: "без формування",
          depth: 0,
          freqs: unlabeled.slice().sort(byFreq),
          children: [],
        });
      }
      const sortNodes = (list) => {
        list.sort((left, right) => {
          if (left.id === "freq:none") return 1;
          if (right.id === "freq:none") return -1;
          return left.label.localeCompare(right.label, "uk", { numeric: true, sensitivity: "base" });
        });
        list.forEach((node) => sortNodes(node.children));
      };
      sortNodes(roots);
      return roots;
    }

    function freqsOf(node) {
      return [...node.freqs.map((row) => row.freq), ...node.children.flatMap(freqsOf)];
    }

    function freqCovered(node) {
      const freqs = freqsOf(node);
      return freqs.length > 0 && freqs.every((freq) => selected("freq", freq));
    }

    function freqPartial(node) {
      if (freqCovered(node)) return false;
      return freqsOf(node).some((freq) => selected("freq", freq));
    }

    function toggleFreqBranch(node) {
      const freqs = freqsOf(node);
      if (freqCovered(node)) {
        const drop = new Set(freqs.map(fold));
        filters.freq = filters.freq.filter((item) => !drop.has(fold(item)));
      } else {
        for (const freq of freqs) {
          if (!selected("freq", freq)) filters.freq.push(freq);
        }
      }
      render();
    }

    function freqNodeHit(node, query) {
      if (fold(node.label).includes(query)) return true;
      if (node.freqs.some((row) => fold(row.freq).includes(query) || fold(leanLabel(row.lean)).includes(query))) return true;
      return node.children.some((child) => freqNodeHit(child, query));
    }

    function visibleFreqEntries(search) {
      const query = fold(search);
      const roots = buildFreqTree(scopedFrequencies());
      const out = [];
      const visit = (node, force) => {
        const own = force || !query || fold(node.label).includes(query);
        const freqHit = node.freqs.some((row) => fold(row.freq).includes(query) || fold(leanLabel(row.lean)).includes(query));
        const childHit = node.children.some((child) => freqNodeHit(child, query));
        if (query && !own && !freqHit && !childHit) return;
        const open = query ? own || freqHit || childHit : freqExpanded.has(node.id);
        out.push({ kind: "group", node, open });
        if (freqAddParent && fold(freqAddParent) === fold(node.id)) out.push({ kind: "add", node, depth: node.depth + 1 });
        if (!open) return;
        const freqs = !query || own
          ? node.freqs
          : node.freqs.filter((row) => fold(row.freq).includes(query) || fold(leanLabel(row.lean)).includes(query));
        for (const row of freqs) out.push({ kind: "freq", row, depth: node.depth + 1 });
        const children = !query || own ? node.children : node.children.filter((child) => freqNodeHit(child, query));
        for (const child of children) visit(child, own);
      };
      roots.forEach((node) => visit(node, false));
      return out;
    }

    function visibleFrequencies(text) {
      return visibleFreqEntries(text).filter((entry) => entry.kind === "freq").map((entry) => entry.row);
    }

    function chips(key, labelOf) {
      const box = document.createElement("div");
      box.className = "chips";
      if (!filters[key].length) return box;
      const shown = filters[key].slice(0, 6);
      for (const value of shown) {

        remove.addEventListener("click", () => toggle(key, value));
        chip.append(remove);
        box.append(chip);
      }
      if (filters[key].length > shown.length) {
        const more = document.createElement("span");
        more.className = "chip";
        more.textContent = "ще " + (filters[key].length - shown.length);

    function allSelected(key, values) {

    function selectAll(key, values) {
      const have = new Set(filters[key].map(fold));
      for (const value of values) {
        if (!have.has(fold(value))) filters[key].push(value);
      }
      render();

    function clearShown(key, values) {
      const drop = new Set(values.map(fold));
      filters[key] = filters[key].filter((item) => !drop.has(fold(item)));
      render();

    const collapsed = new Set();
    let activeFacet = "";
    const facetHeights = {};

    function facet(title, note, body, action, key) {
      const open = !collapsed.has(title);
      const block = document.createElement("section");
      block.className = "facet" + (open ? " is-open" : "") + (activeFacet === title ? " is-active" : "");
      block.addEventListener("pointerdown", () => { activeFacet = title; });
      const head = document.createElement("header");
      const lead = document.createElement("button");
      lead.type = "button";
      lead.className = "facet-lead";
      const chevron = document.createElement("span");
      chevron.className = "facet-chevron";
      chevron.textContent = "▸";
      const label = document.createElement("span");
      label.textContent = title;
      lead.append(chevron, label);
      const chosen = key && filters[key] ? filters[key].length : 0;
      if (chosen) {
        const count = document.createElement("span");
        count.className = "facet-count";
        count.textContent = String(chosen);
        lead.append(count);
      }
      head.append(lead);
      if (action) {
        action.addEventListener("click", (event) => event.stopPropagation());
        head.append(action);
      }
      head.addEventListener("click", () => {
        if (collapsed.has(title)) collapsed.delete(title);
        else collapsed.add(title);
        render();
      });
      if (facetHeights[title]) {
        const list = body.querySelector(".pick-list");
        if (list) list.style.maxHeight = facetHeights[title] + "px";
      }
      block.append(head);
      block.append(body);
      if (note) {
        const hint = document.createElement("p");
        hint.className = "facet-note";
        hint.textContent = note;
        block.append(hint);
      }
      if (open) {
        const handle = document.createElement("div");
        handle.className = "facet-resize";
        handle.setAttribute("role", "separator");
        handle.setAttribute("aria-orientation", "horizontal");
        handle.setAttribute("aria-label", "Висота списку");
        handle.addEventListener("dblclick", (event) => {
          event.stopPropagation();
          const list = block.querySelector(".pick-list");
          if (!list) return;
          const contentH = [...list.children].reduce((sum, child) => sum + child.getBoundingClientRect().height, 0);
          facetHeights[title] = contentH;
          list.style.maxHeight = contentH + "px";
          activeFacet = title;
          block.classList.add("is-open", "is-active");
        });
        handle.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          document.body.classList.add("is-dragging");
          window.getSelection()?.removeAllRanges();
          activeFacet = title;
          block.classList.add("is-open", "is-active");
          block.parentElement?.querySelectorAll(".facet.is-active").forEach((item) => {
            if (item !== block) item.classList.remove("is-active");
          });
          const list = block.querySelector(".pick-list");
          const startY = event.clientY;
          const startH = list ? list.getBoundingClientRect().height : 168;
          const contentH = list
            ? [...list.children].reduce((sum, child) => sum + child.getBoundingClientRect().height, 0)
            : startH;
          const scroller = document.getElementById("filters");
          let pointerY = startY;
          let grown = startH;
          let frame = 0;
          handle.classList.add("is-dragging");
          handle.setPointerCapture(event.pointerId);
          const apply = () => {
            const edge = 56;
            if (pointerY > window.innerHeight - edge) {
              const speed = pointerY > window.innerHeight - 16 ? 18 : 8;
              const next = Math.min(contentH, grown + speed);
              scroller.scrollTop += next - grown;
              grown = next;
            } else if (pointerY < edge) {
              const speed = pointerY < 16 ? 18 : 8;
              grown = Math.max(80, grown - speed);
              scroller.scrollTop -= speed;
            } else {
              grown = Math.min(contentH, Math.max(80, startH + pointerY - startY));
            }
            facetHeights[title] = grown;
            if (list) list.style.maxHeight = grown + "px";
            frame = requestAnimationFrame(apply);
          };
          const move = (ev) => { pointerY = ev.clientY; };
          const up = () => {
            cancelAnimationFrame(frame);
            handle.classList.remove("is-dragging");
            document.body.classList.remove("is-dragging");
            window.getSelection()?.removeAllRanges();
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", up);
            handle.removeEventListener("pointercancel", up);
          };
          handle.addEventListener("pointermove", move);
          handle.addEventListener("pointerup", up);
          handle.addEventListener("pointercancel", up);
          frame = requestAnimationFrame(apply);
        });
        block.append(handle);
        requestAnimationFrame(() => {
          const list = block.querySelector(".pick-list");
          if (!list) return;
          const contentH = [...list.children].reduce((sum, child) => sum + child.getBoundingClientRect().height, 0);
          if (facetHeights[title] > contentH) {
            facetHeights[title] = contentH;
            list.style.maxHeight = contentH + "px";
          }
        });
      }
      return block;
    }

    function allButton(key, values) {

      const full = allSelected(key, values);
      button.textContent = full ? "Зняти" : "Обрати всі";

      });
      return button;
    }

    function fillUnitTree(list, key, search) {
      for (const node of visibleTree(search)) {
        const open = expanded.has(node.id);
        const covered = isCovered(key, node);
        const rowEl = document.createElement("div");
        rowEl.className = "unit-tree-row"
          + (node.children.length ? " unit-tree-row--branch" : "")
          + (node.depth ? " unit-tree-row--nested" : "")
          + (covered ? " unit-tree-row--selected" : "");
        rowEl.style.setProperty("--unit-depth", String(node.depth));
        if (node.children.length) {
          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "unit-tree-toggle" + (open ? " unit-tree-toggle--open" : "");
          toggleBtn.textContent = "▸";
          toggleBtn.setAttribute("aria-label", open ? "Згорнути" : "Розгорнути");
          toggleBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            if (expanded.has(node.id)) expanded.delete(node.id);
            else expanded.add(node.id);
            render();
          });
          rowEl.append(toggleBtn);
        } else {
          const spacer = document.createElement("span");
          spacer.className = "unit-tree-spacer";
          rowEl.append(spacer);
        }
        const select = document.createElement("button");
        select.type = "button";
        select.className = "unit-tree-select";
        const mark = document.createElement("span");
        mark.className = "pick-mark" + (!covered && hasPartial(key, node) ? " partial" : "");
        const title = document.createElement("strong");
        title.textContent = node.label;
        title.title = "Двічі клацніть, щоб перейменувати";
        select.append(mark, title);
        let clickTimer = null;
        select.addEventListener("click", () => {
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => toggleBranch(key, node.id), 220);
        });
        title.addEventListener("dblclick", (event) => {
          event.preventDefault();
          event.stopPropagation();
          clearTimeout(clickTimer);
          const input = document.createElement("input");
          input.type = "text";
          input.className = "tab-name-input";
          input.value = node.label;
          title.replaceWith(input);
          input.focus();
          input.select();
          let done = false;
          const finish = (save) => {
            if (done) return;
            done = true;
            if (save) renameFormation(node.id, input.value);
            else render();
          };
          input.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
            if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
          });
          input.addEventListener("blur", () => finish(true));
        });
        const tools = document.createElement("span");
        tools.className = "keyword-tools";
        const addChild = document.createElement("button");
        addChild.type = "button";
        addChild.className = "keyword-tool";
        addChild.textContent = "+";
        addChild.setAttribute("aria-label", "Додати формування під " + node.label);
        addChild.addEventListener("click", (event) => {
          event.stopPropagation();
          formationChildParent = formationChildParent === node.id ? "" : node.id;
          if (formationChildParent) expanded.add(node.id);
          pendingFocus = formationChildParent ? "formation-child" : "";
          render();
        });
        const removeNode = document.createElement("button");
        removeNode.type = "button";
        removeNode.className = "keyword-tool is-danger";
        removeNode.textContent = "×";
        removeNode.setAttribute("aria-label", "Прибрати " + node.label);
        removeNode.addEventListener("click", (event) => {
          event.stopPropagation();
          const message = node.children.length
            ? "Прибрати формування " + node.label + " і все під ним?"
            : "Прибрати формування " + node.label + "?";
          askConfirm(message, "Прибрати", () => removeFormation(node.id));
        });
        tools.append(addChild, removeNode);
        rowEl.classList.add("unit-tree-row--edit");
        rowEl.append(select, tools);
        list.append(rowEl);
        if (formationChildParent === node.id) {
          const childAdd = document.createElement("form");
          childAdd.className = "tree-add";
          childAdd.style.setProperty("--unit-depth", String(node.depth + 1));
          const childInput = document.createElement("input");
          childInput.type = "text";
          childInput.placeholder = "Під " + node.label;
          childInput.dataset.formationChild = "1";
          const childButton = document.createElement("button");
          childButton.className = "button";
          childButton.type = "submit";
          childButton.textContent = "Додати";
          childAdd.append(childInput, childButton);
          childAdd.addEventListener("submit", (event) => {
            event.preventDefault();
            addFormation(node.id, childInput.value);
          });
          list.append(childAdd);
        }
      }
    }

    function openImage(src) {

    document.addEventListener("click", async (event) => {
      const button = event.target.closest(".mgrs");
      if (!button) return;
      event.preventDefault();
      event.stopPropagation();
      const value = button.dataset.mgrs;
      try {
        await navigator.clipboard.writeText(value);
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = value;
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      const previous = button.textContent;
      button.textContent = "У буфері";
      window.setTimeout(() => { button.textContent = previous; }, 900);
    });
    document.getElementById("image-modal").addEventListener("click", closeImage);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeImage();
    });

    function cardHtml(card) {
      const text = card.body.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll("\n", "<br>");
      const image = card.image && card.image.startsWith("data:") ? "<img src=\"" + card.image + "\"><br>" : "";
      return "<div>" + image + text + "</div>";
    }

    async function copyCard(card, button) {
      const text = card.body;
      const html = cardHtml(card);
      const plain = new Blob([text], { type: "text/plain" });
      const rich = new Blob([html], { type: "text/html" });
      let copiedImage = false;
      if (navigator.clipboard && navigator.clipboard.write) {
        const types = {
          "text/plain": Promise.resolve(plain),
          "text/html": Promise.resolve(rich),
        };
        try {
          await navigator.clipboard.write([new ClipboardItem(types)]);
          copiedImage = Boolean(card.image);
        } catch (err) {
          try {
            await navigator.clipboard.write([new ClipboardItem({
              "text/plain": Promise.resolve(plain),
              "text/html": Promise.resolve(rich),
            })]);
            copiedImage = Boolean(card.image);
          } catch (err2) {
            copiedImage = false;
          }
        }
      }
      if (!copiedImage) {
        const holder = document.createElement("div");
        holder.contentEditable = "true";
        holder.style.position = "fixed";
        holder.style.left = "-9999px";
        holder.innerHTML = html;
        document.body.append(holder);
        const range = document.createRange();
        range.selectNodeContents(holder);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        copiedImage = document.execCommand("copy") && Boolean(card.image);
        selection.removeAllRanges();
        holder.remove();
      }
      button.textContent = card.image && copiedImage ? "Текст і зображення" : "У буфері";
      window.setTimeout(() => { button.textContent = "Копіювати"; }, 1200);
    }

    function makeMapImage() {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#3d5c34";
      ctx.fillRect(0, 0, 640, 360);
      for (let i = 0; i < 18; i += 1) {
        ctx.fillStyle = i % 2 ? "#6b8f4e" : "#8a7344";
        ctx.fillRect((i * 47) % 640, (i * 29) % 280, 90, 50);
      }
      ctx.strokeStyle = "#d6b588";
      ctx.lineWidth = 2;
      ctx.strokeRect(250, 140, 70, 46);
      return new Promise((resolve) => canvas.toBlob((blob) => {
        resolve({ url: URL.createObjectURL(blob), blob });
      }, "image/png"));
    }

    function renderBoards() {
      const scrollState = new Map();
      for (const board of document.querySelectorAll(".board[data-flow]")) {
        const scroller = board.querySelector(".pane-body");
        if (!scroller) continue;
        scrollState.set(board.dataset.flow, { top: scroller.scrollTop, height: scroller.scrollHeight });
      }
      const root = document.getElementById("boards");
      const split = activeKind === "split" ? splits.find((item) => item.id === activeSplitId) : null;
      const visible = split
        ? split.members.map((id) => flows.find((flow) => flow.id === id)).filter(Boolean).slice(0, 6)
        : [currentFlow()];
      root.dataset.n = String(Math.max(visible.length, 1));
      root.replaceChildren();
      if (split && !visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = "<h3>Поділ порожній</h3><p>Перетягніть вкладки в рамку поділу. Максимум 6.</p>";
        root.append(empty);
        return;
      }
      const active = currentFlow();
      matchCount.textContent = positive(active.filters) ? hitCount(active) + " / " + cards.length : "немає фільтра";
      for (const flow of visible) {
        const board = document.createElement("section");
        board.dataset.flow = String(flow.id);
        board.className = "board" + (flow.id === activeId ? " on" : "");
        board.addEventListener("click", (event) => {
          if (event.target.closest("button")) return;
          if (flow.id === activeId) return;
          useFlow(flow);
          render();
        });
        const head = document.createElement("header");
        const title = document.createElement("h2");
        title.textContent = flow.name;
        title.addEventListener("click", (event) => {
          event.stopPropagation();
          const owner = splits.find((item) => item.members.includes(flow.id));
          if (owner) {
            activeKind = "split";
            activeSplitId = owner.id;
          }
          useFlow(flow);
          render();
        });
        head.append(title);
        const body = document.createElement("div");
        body.className = "pane-body";
        body.addEventListener("scroll", () => {
          if (body.scrollTop < 24) {
            markSeen(flow);
            paintSignals();
          }
        });
        const feedEl = document.createElement("div");
        feedEl.className = "feed";
        body.append(feedEl);
        board.append(head, body);
        root.append(board);
        fillFeed(feedEl, flow);
      }
      for (const board of root.querySelectorAll(".board[data-flow]")) {
        const prev = scrollState.get(board.dataset.flow);
        if (!prev || prev.top < 24) continue;
        const scroller = board.querySelector(".pane-body");
        scroller.scrollTop = prev.top + Math.max(0, scroller.scrollHeight - prev.height);
      }
    }

    function fillFeed(feedEl, flow) {
      const shown = cards.filter((card) => matchesSet(flow.filters, card));
      const previous = new Set(shownByFlow.get(flow.id) || []);
      shownByFlow.set(flow.id, shown.map((card) => card.id));
      const freshId = shown.find((card) => card.fresh && !previous.has(card.id))?.id;
      feedEl.replaceChildren();
      if (!positive(flow.filters)) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = '<div class="glyph cut">ꑭ</div><h3>Фільтр порожній</h3><p>Оберіть формування, частоту, ім’я, слово або джерело.</p>';
        feedEl.append(empty);
        return;
      }
      if (!shown.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = "<h3>Немає збігів</h3><p>У макеті немає картки під цей фільтр.</p>";
        feedEl.append(empty);
        return;
      }
      shown.forEach((card, index) => {
        const article = document.createElement("article");
        const entering = card.id === freshId;
        article.className = "card cut" + (card.fresh ? " card--fresh" : "") + (entering ? " card-enter" : "");
        article.dataset.card = String(card.id);
        const head = document.createElement("header");
        const title = document.createElement("strong");
        const lines = String(card.body || "").split("\n");
        const sourceLine = lines.find((line) => line.startsWith("Джерело:"));
        const hierarchyLine = lines.find((line) => line.startsWith("Ієрархія:"));
        const source = displaySource(sourceLine ? sourceLine.replace(/^Джерело:\s*/, "") : "Джерело");
        const hierarchy = hierarchyLine ? hierarchyLine.replace(/^Ієрархія:\s*/, "") : "";
        title.textContent = hierarchy ? source + " - " + hierarchy : source;
        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "button";
        copy.textContent = "Копіювати";
        copy.addEventListener("click", () => copyCard(card, copy));
        head.append(title, copy);
        let shot = null;
        if (card.image) {
          shot = document.createElement("button");
          shot.type = "button";
          shot.className = "card-shot-btn";
          const img = document.createElement("img");
          img.className = "card-shot";
          img.src = card.image;
          img.alt = "Зображення перехоплення";
          shot.append(img);
          shot.addEventListener("click", () => openImage(card.image));
        }
        const body = document.createElement("div");
        body.className = "card-body";
        const visible = card.body
          .split("\n")
          .filter((line) => {
            const text = line.trim();
            return !text.startsWith("Джерело:") && !text.startsWith("Ієрархія:") && !text.includes("ПОТІК 125 ОВМБр");
          })
          .join("\n")
          .replace(/\n{3,}/g, "\n\n");
        let htmlBody = visible
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;");
        if (card.freq) htmlBody = htmlBody.replace(card.freq, '<span class="freq">' + card.freq + "</span>");
        htmlBody = htmlBody.replace(/\d{1,2}[A-Z]\s+[A-Z]{2}\s+\d{5}\s+\d{5}/g, (match) => {
          const clean = match.replace(/\s+/g, " ");
          return '<button type="button" class="mgrs" data-mgrs="' + clean + '">' + clean + "</button>";
        });
        body.innerHTML = htmlBody;
        if (card.image) {
          const main = document.createElement("div");
          main.className = "card-main";
          main.append(shot, body);
          article.append(head, main);
        } else {
          article.append(head, body);
        }
        feedEl.append(article);
      });

    function beginRename(id) {
      render();
      const name = document.querySelector('.tab[data-flow="' + id + '"] .tab-name');
      const flow = flows.find((item) => item.id === id);
      if (!name || !flow) return;

      input.style.width = Math.max(flow.name.length, 1) + "ch";

      name.replaceWith(input);
      input.focus();
      input.select();
      const commit = () => {
        const next = input.value.trim();
        flow.name = next || "Потік";
        render();
      };
      input.addEventListener("input", () => {
        input.style.width = Math.max(input.value.length, 1) + "ch";
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") input.blur();
        if (event.key === "Escape") {

          input.blur();

      });
      input.addEventListener("blur", commit);

    function makeSplit() {
      const split = { id: entrySeq++, name: "Поділ", members: [] };
      splits.push(split);
      entries.push({ type: "split", id: split.id });
      return split;
    }

    function flowEntryIndex(flowId) {
      return entries.findIndex((entry) => entry.type === "flow" && entry.id === flowId);
    }

    function detachFlow(flowId) {
      const index = flowEntryIndex(flowId);
      if (index >= 0) entries.splice(index, 1);
      for (const split of splits) {
        split.members = split.members.filter((id) => id !== flowId);
      }
    }

    function addToSplit(splitId, flowId) {
      const split = splits.find((item) => item.id === splitId);
      const flow = flows.find((item) => item.id === flowId);
      if (!split || !flow || split.members.includes(flowId) || split.members.length >= 6) return;
      detachFlow(flowId);
      split.members.push(flowId);
      activeKind = "split";
      activeSplitId = split.id;
      useFlow(flow);
      render();
    }

    function releaseFromSplit(flowId) {
      detachFlow(flowId);
      entries.push({ type: "flow", id: flowId });
      activeKind = "flow";
      useFlow(flows.find((item) => item.id === flowId));
      render();
    }

          clickTimer = setTimeout(() => {
            const same = activeKind === "flow" && flow.id === activeId;
            if (same && !watchOpen) return;
            activeKind = "flow";
            watchOpen = false;

          close.addEventListener("click", (event) => {

            flows.splice(index, 1);

            if (!entries.some((item) => item.type === "flow" && flows.some((flowItem) => flowItem.id === item.id))) {
              entries.unshift({ type: "flow", id: flows[0].id });
            }

            render();
            });
          });
          tab.append(close);
        }
        bar.append(tab);
      }
      const add = document.createElement("button");
      add.type = "button";
      add.className = "tab-add";
      add.textContent = "+";
      add.setAttribute("aria-label", "Новий потік");
      add.addEventListener("click", () => {
        const flow = makeFlow("Потік " + flowSeq);
        flows.push(flow);
        entries.push({ type: "flow", id: flow.id });
        watchOpen = false;
        activeKind = "flow";
        useFlow(flow);
        render();
      });
      const splitAdd = document.createElement("button");
      splitAdd.type = "button";
      splitAdd.className = "tab-add";
      splitAdd.innerHTML = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
      splitAdd.setAttribute("aria-label", "Новий поділ");
      splitAdd.title = "Поділ: перетягніть сюди до 6 вкладок";
      splitAdd.addEventListener("click", () => {
        const split = makeSplit();
        activeKind = "split";
        activeSplitId = split.id;
        render();

      bar.append(add, splitAdd);

    const incoming = [
      { freq: "164.1250", units: ["20 ЗА", "283 мсп"], place: "КАТЕРИНІВКА", source: "⚛️ Нейтрон 2.0 ⚛️" },
      { freq: "150.5000", units: ["71 опбпс"], place: "ЗЕЛЕНА ДОЛИНА", name: "Хруст", source: "📖 Альманах 📖" },
      { freq: "151.4800", units: ["856 сап"], place: "НОВОСАДОВЕ", source: "🗿Каменярі🗿" },
      { freq: "146.5500", units: ["1 мсп"], place: "ДРОБИШЕВЕ", source: "🦉 Вуха 66 🦉" },
      { freq: "149.5250", units: ["1 мсб"], place: "ІВАНІВКА", source: "⚛️ Нейтрон 2.0 ⚛️" },
      { freq: "136.1600", units: ["1 ТА"], place: "КОЛОДЯЗІ", source: "📖 Альманах 📖" },
    ];
    let incomingAt = 0;
